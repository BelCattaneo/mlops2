[project]
name = "mlops2-minitps"
version = "0.1.0"
description = "Mini-TPs de Operaciones de Aprendizaje Automático II (CEIA-FIUBA): modelo de arrestos de Chicago servido por REST, GraphQL y gRPC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pyproj>=3.8.0",
    "scikit-learn>=1.9.1",
    "tzdata>=2026.3",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "arrest_model",
    "tp1_rest",
    "tp2_graphql",
    "tp3_grpc",
    "tp4_streaming",
    "tp5_federated",
    "tp6_datalake",
]

[tool.uv]
default-groups = "all"

[tool.ruff]
line-length = 100
target-version = "py312"
# Los *_pb2*.py los genera protoc, y los notebooks son entregables de la cátedra que se
# entregan ejecutados: la fuente que sí se lintea son los .py, que el notebook importa.
extend-exclude = ["**/*_pb2.py", "**/*_pb2_grpc.py", "**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los helpers del ETL viven en el directorio de los DAGs, que es lo que Airflow pone en el
# path cuando los carga; acá se lo agrega pytest para poder testearlos sin levantar Airflow.
pythonpath = ["airflow/dags"]
markers = [
    "neo4j: requiere Neo4j corriendo en localhost:7687",
    "kafka: requiere un broker corriendo en localhost:9092",
    "minio: requiere MinIO corriendo en localhost:9000",
    "mlflow: requiere el servidor de MLflow corriendo en localhost:5001",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.10.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.16.7",
]
graphql = [
    "neo4j>=6.3.0",
    "strawberry-graphql[fastapi]>=0.327.7",
    "uvicorn[standard]>=0.52.4",
]
grpc = [
    "grpcio>=1.83.1",
    "grpcio-tools>=1.83.1",
]
rest = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]
# Lo que necesita un servicio para traer el champion del Model Registry en vez del .pkl del
# repo: el cliente liviano de MLflow (sin servidor ni UI) y boto3 para bajar el artefacto
# de MinIO. Medido: alcanza `mlflow-skinny` para resolver el alias y bajar los artefactos.
serving = [
    "boto3>=1.40.0",
    "mlflow-skinny>=3.16.1",
]
lake = [
    "boto3>=1.40.0",
    "mlflow-skinny>=3.16.1",
    "pyarrow>=21.0.0",
]
streaming = [
    "kafka-python>=3.0.11",
]
etl = [
    "geopandas>=1.0.0",
    "imbalanced-learn>=0.13.0",
    "sodapy>=2.2.0",
]
