# WARNING: This configuration is for local development. Do not use it in a production deployment.
x-airflow-common: &airflow-common
  build: './docker/airflow'
  image: ${AIRFLOW_IMAGE_NAME:-extending_airflow:latest}
  profiles:
    - airflow
    - all
  environment: &airflow-common-env
    # LocalExecutor en vez de Celery: las tareas corren en el proceso del scheduler, así que se
    # van el worker y el broker. Un DAG de entrenamiento que se dispara a mano no necesita una
    # cola distribuida, y en esta máquina esos dos contenedores son 1.3 GB.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres/${PG_DATABASE:-airflow}
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres/${PG_DATABASE:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__API_AUTH__JWT_SECRET: 'qt2Edq6LIRdv5k0DDznVOA=='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false' # Change to 'false' to remove the tutorials and examples
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'True'
    AIRFLOW__SECRETS__BACKEND: airflow.secrets.local_filesystem.LocalFilesystemBackend
    AIRFLOW__SECRETS__BACKEND_KWARGS: '{"variables_file_path": "/opt/secrets/variables.yaml", "connections_file_path": "/opt/secrets/connections.yaml"}'
    SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN}
    AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minio}
    AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minio123}
    AWS_ENDPOINT_URL_S3: http://s3:9000
    MLFLOW_S3_ENDPOINT_URL: http://s3:9000
    # Para que el DAG pueda importar `arrest_model`, que es la codificación que comparten los
    # cuatro protocolos: el contrato de features del dataset curado sale de ahí y no de una
    # lista escrita a mano.
    PYTHONPATH: /opt/project
  volumes:
    - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-./airflow}/secrets:/opt/secrets
    - ./arrest_model:/opt/project/arrest_model:ro
  networks:
    - frontend
    - backend
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  depends_on:  &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    restart: always
    build: './docker/postgres'
    image: postgres_system
    container_name: postgres
    profiles:
      - airflow
      - mlflow
      - all
    ports:
      # PG_PORT es el puerto en la máquina; adentro siempre es 5432.
      - "${PG_PORT:-5433}:5432"
    networks:
      - backend
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${PG_DATABASE:-airflow}
      - POSTGRES_USER=${PG_USER:-airflow}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-airflow}
      - POSTGRES_DATABASE=${PG_DATABASE:-airflow}
      # Puerto interno fijo: los demás servicios se conectan a postgres:5432.
      - POSTGRES_PORT=5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "5432", "-U", "${PG_USER:-airflow}"]
      interval: 60s
      timeout: 20s
      retries: 3

  s3:
    restart: always
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    profiles:
      - mlflow
      - airflow
      - all
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_PORT_UI:-9001}:9001"
    networks:
      - frontend
      - backend
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY:-minio123}
    volumes:
      - minio_data:/data
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 60s
      timeout: 20s
      retries: 3

  create_s3_buckets:
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio_create_bucket
    profiles:
      - mlflow
      - airflow
      - all
    depends_on:
      - s3
    networks:
      - backend
    entrypoint: >
      /bin/sh -c '
      sleep 5;
      /usr/bin/mc alias set s3 http://s3:9000 ${MINIO_ACCESS_KEY:-minio} ${MINIO_SECRET_ACCESS_KEY:-minio123};
      /usr/bin/mc mb s3/${MLFLOW_BUCKET_NAME:-mlflow};
      /usr/bin/mc mb s3/${DATA_REPO_BUCKET_NAME:-data};
      exit 0;
      '

  mlflow:
    restart: always
    build: "./docker/mlflow"
    image: mlflow
    container_name: mlflow
    profiles:
      - mlflow
      - all
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    networks:
      - frontend
      - backend
    environment:
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true
      # MLflow 3 levanta procesos de fondo para scoring online y archivado de trazas. Acá no se
      # usan, y cada uno carga la librería entera: son varios cientos de MB por proceso.
      - MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minio}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-minio123}
      - MLFLOW_S3_ENDPOINT_URL=http://s3:9000
      - MLFLOW_S3_ADDRESSING_STYLE=path
    # gunicorn arranca 4 workers por defecto y cada uno carga MLflow entero: 2 GB solo de
    # tracking. Con 2 alcanza para el DAG de entrenamiento y para las APIs leyendo el champion.
    command: >
      mlflow server
      --backend-store-uri postgresql://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres:5432/mlflow_db
      --host 0.0.0.0
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME:-mlflow}/
      --gunicorn-opts "--timeout 180 --workers 2"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://mlflow:5000 || exit 1
      interval: 60s
      timeout: 10s
      retries: 3

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
  
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    container_name: airflow_cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID:-50000}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:${AIRFLOW_GID:-0}"
        echo
        chown -R "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:${AIRFLOW_GID:-0}"
        echo
        chown -v -R "${AIRFLOW_UID}:${AIRFLOW_GID:-0}" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  # Las tres APIs de los mini-TPs, sirviendo el champion del Model Registry en vez del .pkl que
  # tienen horneado. Van en su propio profile a propósito: sin una versión con el alias
  # `champion` no hay nada que servir, así que se levantan después de que entrenó el DAG y no
  # junto con la plataforma. La misma imagen corrida sin `MODEL_URI` sigue sirviendo el .pkl.
  #
  # Tags, nombres de contenedor y puertos publicados son propios, distintos de los que usa el
  # Makefile para correr los mini-TPs sueltos (`arrest-rest` en 8000, etc.): así los dos pueden
  # estar arriba a la vez y ningún build le pisa la imagen al otro. El puerto de adentro sí es
  # el mismo, que es el que nombra el diagrama de arquitectura.
  rest:
    restart: always
    build:
      context: .
      dockerfile: tp1_rest/Dockerfile
    image: mlops2-rest
    container_name: mlops2-rest
    profiles:
      - serving
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "${STACK_REST_PORT:-8002}:8000"
    networks:
      - frontend
      - backend
    environment: &serving-env
      # La uri es un alias, no un número de versión: promover otra versión del modelo no
      # requiere tocar el compose ni reconstruir la imagen, solo mover el alias en MLflow.
      MODEL_URI: "models:/${MODEL_NAME:-chicago-arrest-xgboost}@champion"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      MLFLOW_S3_ADDRESSING_STYLE: path
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minio123}
    # La imagen es python:3.12-slim y no trae curl ni wget. /health da 503 mientras no hay
    # modelo, así que el servicio queda unhealthy hasta que haya un champion.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  graphql:
    restart: always
    build:
      context: .
      dockerfile: tp2_graphql/Dockerfile
    image: mlops2-graphql
    container_name: mlops2-graphql
    profiles:
      - serving
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "${STACK_GRAPHQL_PORT:-8012}:8010"
    networks:
      - frontend
      - backend
    # El driver de Neo4j es perezoso y no conecta hasta la primera consulta, así que el
    # servicio levanta igual con el perfil `lineage` apagado: lo único que falla entonces es el
    # campo `lineage` de la query, que es el comportamiento que documenta el mini-TP 2.
    environment:
      <<: *serving-env
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-testpass}
    # Un GET a /graphql solo devuelve GraphiQL si el pedido acepta HTML; sin eso Strawberry
    # contesta 400. Y que el proceso esté sirviendo alcanza como chequeo acá: este servicio no
    # arranca sin modelo, así que si responde es porque lo cargó.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen(r.Request('http://localhost:8010/graphql', headers={'Accept': 'text/html'}))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  grpc:
    restart: always
    build:
      context: .
      dockerfile: tp3_grpc/Dockerfile
    image: mlops2-grpc
    container_name: mlops2-grpc
    profiles:
      - serving
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "${STACK_GRPC_PORT:-50052}:50051"
    networks:
      - frontend
      - backend
    environment: *serving-env
    # Sin healthcheck: el servicio expone Predict y PredictStream, no un Health, y probarlo
    # desde el contenedor significaría hacer una predicción de mentira en cada chequeo.

  # El grafo de linaje del mini-TP 2, en su propio perfil porque es opcional: son 500 MB de
  # memoria para una consulta que no hace falta para predecir. Publica en otros puertos que el
  # `neo4j-tp` que levanta el Makefile (7474 y 7687), por lo mismo que las tres APIs.
  neo4j:
    restart: always
    image: neo4j:5.26-community
    container_name: mlops2-neo4j
    profiles:
      - lineage
    ports:
      - "${STACK_NEO4J_HTTP_PORT:-7475}:7474"
      - "${STACK_NEO4J_BOLT_PORT:-7688}:7687"
    networks:
      - frontend
      - backend
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-testpass}
      # Con los valores por defecto reserva más de 1 GB; acá el grafo son unos pocos nodos.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-testpass} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  db_data:
  minio_data:
  neo4j_data:
