# WARNING: This configuration is for local development. Do not use it in a production deployment.
x-airflow-common: &airflow-common
  build: './docker/airflow'
  image: ${AIRFLOW_IMAGE_NAME:-extending_airflow:latest}
  profiles:
    - airflow
    - all
  environment: &airflow-common-env
    # LocalExecutor en vez de Celery: las tareas corren en el proceso del scheduler, así que se
    # van el worker y el broker. Un DAG de entrenamiento que se dispara a mano no necesita una
    # cola distribuida, y en esta máquina esos dos contenedores son 1.3 GB.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres/${PG_DATABASE:-airflow}
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres/${PG_DATABASE:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__API_AUTH__JWT_SECRET: 'qt2Edq6LIRdv5k0DDznVOA=='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false' # Change to 'false' to remove the tutorials and examples
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'True'
    AIRFLOW__SECRETS__BACKEND: airflow.secrets.local_filesystem.LocalFilesystemBackend
    AIRFLOW__SECRETS__BACKEND_KWARGS: '{"variables_file_path": "/opt/secrets/variables.yaml", "connections_file_path": "/opt/secrets/connections.yaml"}'
    SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN}
    AWS_ACCESS_KEY_ID: ${AIRFLOW_MINIO_KEY:-airflow-svc}
    AWS_SECRET_ACCESS_KEY: ${AIRFLOW_MINIO_SECRET:-airflow-svc-secret}
    AWS_ENDPOINT_URL_S3: http://s3:9000
    MLFLOW_S3_ENDPOINT_URL: http://s3:9000
    # Para que el DAG pueda importar `arrest_model`, que es la codificación que comparten los
    # cuatro protocolos: el contrato de features del dataset curado sale de ahí y no de una
    # lista escrita a mano.
    # Dónde escribir el grafo de linaje. Si no responde, las tareas siguen igual: el linaje
    # es trazabilidad, no una dependencia del pipeline de datos.
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: ${NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-testpass}
    PYTHONPATH: /opt/project
  volumes:
    - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-./airflow}/secrets:/opt/secrets
    - ./arrest_model:/opt/project/arrest_model:ro
  networks:
    - frontend
    - backend
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  depends_on:  &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    restart: always
    build: './docker/postgres'
    image: postgres_system
    container_name: postgres
    profiles:
      - airflow
      - mlflow
      - all
    ports:
      # PG_PORT es el puerto en la máquina; adentro siempre es 5432.
      - "${PG_PORT:-5433}:5432"
    networks:
      - backend
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${PG_DATABASE:-airflow}
      - POSTGRES_USER=${PG_USER:-airflow}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-airflow}
      - POSTGRES_DATABASE=${PG_DATABASE:-airflow}
      # Puerto interno fijo: los demás servicios se conectan a postgres:5432.
      - POSTGRES_PORT=5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "5432", "-U", "${PG_USER:-airflow}"]
      interval: 60s
      timeout: 20s
      retries: 3

  s3:
    restart: always
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    profiles:
      - mlflow
      - airflow
      - all
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_PORT_UI:-9001}:9001"
    networks:
      - frontend
      - backend
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY:-minio123}
    volumes:
      - minio_data:/data
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 60s
      timeout: 20s
      retries: 3

  create_s3_buckets:
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio_create_bucket
    profiles:
      - mlflow
      - airflow
      - all
    depends_on:
      - s3
    networks:
      - backend
    # Crea los buckets y, además, una credencial por servicio con lo mínimo que cada uno necesita.
    # La root queda acá y en MinIO: antes la compartían diez de los doce servicios, así que
    # cualquiera de ellos podía borrar el data lake entero.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        sleep 5
        /usr/bin/mc alias set s3 http://s3:9000 ${MINIO_ACCESS_KEY:-minio} ${MINIO_SECRET_ACCESS_KEY:-minio123}
        /usr/bin/mc mb --ignore-existing s3/${MLFLOW_BUCKET_NAME:-mlflow}
        /usr/bin/mc mb --ignore-existing s3/${DATA_REPO_BUCKET_NAME:-data}

        # Airflow es dueño del bucket de datos —lo crea, le pone versionado y retención por
        # capa— y escribe los artefactos de los modelos que registra.
        cat > /tmp/airflow.json <<'JSON'
        {"Version": "2012-10-17", "Statement": [
          {"Effect": "Allow", "Action": ["s3:*"],
           "Resource": ["arn:aws:s3:::${DATA_REPO_BUCKET_NAME:-data}",
                        "arn:aws:s3:::${DATA_REPO_BUCKET_NAME:-data}/*"]},
          {"Effect": "Allow",
           "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject",
                      "s3:ListBucket", "s3:GetBucketLocation"],
           "Resource": ["arn:aws:s3:::${MLFLOW_BUCKET_NAME:-mlflow}",
                        "arn:aws:s3:::${MLFLOW_BUCKET_NAME:-mlflow}/*"]}
        ]}
        JSON

        # MLflow solo administra su propio bucket de artefactos.
        cat > /tmp/mlflow.json <<'JSON'
        {"Version": "2012-10-17", "Statement": [
          {"Effect": "Allow", "Action": ["s3:*"],
           "Resource": ["arn:aws:s3:::${MLFLOW_BUCKET_NAME:-mlflow}",
                        "arn:aws:s3:::${MLFLOW_BUCKET_NAME:-mlflow}/*"]}
        ]}
        JSON

        # El servicio que sirve el modelo solo baja el artefacto del champion: no escribe nada.
        cat > /tmp/rest.json <<'JSON'
        {"Version": "2012-10-17", "Statement": [
          {"Effect": "Allow", "Action": ["s3:GetObject", "s3:ListBucket", "s3:GetBucketLocation"],
           "Resource": ["arn:aws:s3:::${MLFLOW_BUCKET_NAME:-mlflow}",
                        "arn:aws:s3:::${MLFLOW_BUCKET_NAME:-mlflow}/*"]}
        ]}
        JSON

        for servicio in airflow mlflow rest; do
          /usr/bin/mc admin policy create s3 "$$servicio" "/tmp/$$servicio.json"
        done
        /usr/bin/mc admin user add s3 ${AIRFLOW_MINIO_KEY:-airflow-svc} ${AIRFLOW_MINIO_SECRET:-airflow-svc-secret}
        /usr/bin/mc admin user add s3 ${MLFLOW_MINIO_KEY:-mlflow-svc} ${MLFLOW_MINIO_SECRET:-mlflow-svc-secret}
        /usr/bin/mc admin user add s3 ${REST_MINIO_KEY:-rest-svc} ${REST_MINIO_SECRET:-rest-svc-secret}
        # `attach` falla si la política ya está puesta, y esto corre en cada `up`.
        /usr/bin/mc admin policy attach s3 airflow --user ${AIRFLOW_MINIO_KEY:-airflow-svc} || true
        /usr/bin/mc admin policy attach s3 mlflow --user ${MLFLOW_MINIO_KEY:-mlflow-svc} || true
        /usr/bin/mc admin policy attach s3 rest --user ${REST_MINIO_KEY:-rest-svc} || true
        exit 0

  mlflow:
    restart: always
    build: "./docker/mlflow"
    image: mlflow
    container_name: mlflow
    profiles:
      - mlflow
      - all
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    networks:
      - frontend
      - backend
    environment:
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true
      # MLflow 3 levanta procesos de fondo para scoring online y archivado de trazas. Acá no se
      # usan, y cada uno carga la librería entera: son varios cientos de MB por proceso.
      - MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false
      - AWS_ACCESS_KEY_ID=${MLFLOW_MINIO_KEY:-mlflow-svc}
      - AWS_SECRET_ACCESS_KEY=${MLFLOW_MINIO_SECRET:-mlflow-svc-secret}
      - MLFLOW_S3_ENDPOINT_URL=http://s3:9000
      - MLFLOW_S3_ADDRESSING_STYLE=path
    # gunicorn arranca 4 workers por defecto y cada uno carga MLflow entero: 2 GB solo de
    # tracking. Con 2 alcanza para el DAG de entrenamiento y para las APIs leyendo el champion.
    command: >
      mlflow server
      --backend-store-uri postgresql://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres:5432/mlflow_db
      --host 0.0.0.0
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME:-mlflow}/
      --gunicorn-opts "--timeout 180 --workers 2"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://mlflow:5000 || exit 1
      interval: 60s
      timeout: 10s
      retries: 3

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
  
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    container_name: airflow_cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID:-50000}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:${AIRFLOW_GID:-0}"
        echo
        chown -R "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:${AIRFLOW_GID:-0}"
        echo
        chown -v -R "${AIRFLOW_UID}:${AIRFLOW_GID:-0}" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  # El único servicio de inferencia de la plataforma, sirviendo el champion del Model Registry
  # en vez del .pkl que la imagen tiene horneado. Va en su propio profile a propósito: sin una
  # versión con el alias `champion` no hay nada que servir, así que se levanta después de que
  # entrenó el DAG. La misma imagen corrida sin `MODEL_URI` sigue sirviendo el .pkl.
  #
  # Por qué uno y no tres, con los números: `docs/arquitectura.md`. En resumen, a 633 reportes
  # por día la ventaja de gRPC son 1,35 segundos por día, y en lote REST le gana.
  #
  # Tags, nombre de contenedor y puerto publicado son propios, distintos de los que usa el
  # Makefile para correr el mini-TP suelto (`arrest-rest` en 8000): así los dos pueden estar
  # arriba a la vez y ningún build le pisa la imagen al otro. El puerto de adentro sí es el
  # mismo, que es el que nombra el diagrama de arquitectura.
  rest:
    restart: always
    build:
      context: .
      dockerfile: tp1_rest/Dockerfile
    image: mlops2-rest
    container_name: mlops2-rest
    profiles:
      - serving
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "${STACK_REST_PORT:-8002}:8000"
    networks:
      - frontend
      - backend
    environment:
      # La uri es un alias, no un número de versión: promover otra versión del modelo no
      # requiere tocar el compose ni reconstruir la imagen, solo mover el alias en MLflow.
      MODEL_URI: "models:/${MODEL_NAME:-chicago-arrest-xgboost}@champion"
      # Cada cuánto el servicio le pregunta al registro si hay otra versión. Con esto,
      # promover es mover el alias y esperar un minuto, sin reiniciar nada. La consulta no
      # baja artefactos: solo resuelve el alias.
      MODEL_TTL_SECONDS: "60"
      # Con qué firma y verifica los tokens de acceso. Va vacío si falta en el .env, y entonces
      # el servicio no arranca y lo dice en su log: `make stack-token` emite los tokens.
      REST_JWT_SECRET: ${REST_JWT_SECRET:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      MLFLOW_S3_ADDRESSING_STYLE: path
      AWS_ACCESS_KEY_ID: ${REST_MINIO_KEY:-rest-svc}
      AWS_SECRET_ACCESS_KEY: ${REST_MINIO_SECRET:-rest-svc-secret}
    # La imagen es python:3.12-slim y no trae curl ni wget. /health da 503 mientras no hay
    # modelo, así que el servicio queda unhealthy hasta que haya un champion.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # El grafo de linaje: qué particiones crudas produjeron qué curada, y de cuál salió cada
  # versión del modelo. Los nodos son instancias, no etapas: por eso vale una base de grafos y
  # no un dibujo. La pregunta que contesta y MLflow no es la inversa —"este mes del portal vino
  # mal, ¿qué versiones hay que revisar?"— que es un recorrido de profundidad desconocida.
  #
  # Va en el perfil `all` y no en uno opcional: lo escribe el pipeline mientras corre, y un
  # grafo con huecos silenciosos es tan malo para auditar como uno equivocado.
  neo4j:
    restart: always
    image: neo4j:5.26-community
    container_name: mlops2-neo4j
    profiles:
      - all
    ports:
      - "${STACK_NEO4J_HTTP_PORT:-7475}:7474"
      - "${STACK_NEO4J_BOLT_PORT:-7688}:7687"
    networks:
      - frontend
      - backend
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-testpass}
      # El grafo son unos cientos de nodos: con los valores por defecto reservaría más de 1 GB.
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-testpass} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  db_data:
  minio_data:
  neo4j_data:
